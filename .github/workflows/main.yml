name: CI - Rota Aberta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # INTEGRAÇÃO CONTÍNUA (CI)
  #   Roda em todo push e pull request para a branch main:
  #   lint -> testes -> build.
  #
  #   O deploy (CD) NÃO é feito por este workflow. O projeto está
  #   conectado à Vercel via integração Git nativa (Settings -> Git no
  #   dashboard da Vercel), que já publica automaticamente em produção
  #   a cada push na main e cria preview deploys para cada Pull Request.
  #   Isso evita depender de tokens/CLI dentro do Actions.
  # ---------------------------------------------------------------------
  ci:
    name: CI - Lint, Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar lint (ESLint)
        run: npm run lint

      - name: Rodar testes (Vitest)
        run: npm run test

      - name: Build da aplicação (Next.js)
        run: npm run build
