name: CI/CD - Rota Aberta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita rodar duas pipelines ao mesmo tempo para o mesmo branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # 1. INTEGRAÇÃO CONTÍNUA (CI)
  #    Roda em todo push e pull request para a branch main.
  # ---------------------------------------------------------------------
  ci:
    name: CI - Lint, Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar lint (ESLint)
        run: npm run lint

      - name: Rodar testes (Vitest)
        run: npm run test

      - name: Build da aplicação (Next.js)
        run: npm run build

      # Guarda o resultado do build para o job de deploy não precisar
      # buildar tudo de novo.
      - name: Upload do build (.next) como artefato
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.ts
          retention-days: 1

  # ---------------------------------------------------------------------
  # 2. ENTREGA CONTÍNUA (CD) - Deploy na Vercel
  #    Só roda após o job "ci" passar, e apenas em push direto na main
  #    (não roda em pull request, só depois do merge).
  # ---------------------------------------------------------------------
  deploy:
    name: CD - Deploy na Vercel
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Verificar secrets da Vercel
        run: |
          test -n "$VERCEL_TOKEN" || (echo "❌ Secret VERCEL_TOKEN não configurado (Settings → Secrets and variables → Actions)" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "❌ Secret VERCEL_ORG_ID não configurado" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "❌ Secret VERCEL_PROJECT_ID não configurado" && exit 1)
          echo "✅ Secrets presentes"

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Baixar configuração do ambiente Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build do projeto via Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy do artefato pré-buildado na Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          echo "🚀 Deploy publicado em: $url"
